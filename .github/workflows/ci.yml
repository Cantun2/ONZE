name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # Fast backtest smoke: only runs if the processed DB exists. Absent data
      # (the default in CI) is a graceful skip, not a failure (spec §3.6).
      - name: Backtest smoke (guarded)
        run: |
          if [ -f data/processed/onze.duckdb ]; then
            echo "Processed data found — running fast backtest smoke."
            python -m src.eval.backtest --smoke || {
              echo "::error::Backtest smoke failed."; exit 1;
            }
          else
            echo "::notice::No processed data (data/processed/onze.duckdb) — skipping backtest smoke."
          fi
