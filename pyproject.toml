[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onze"
version = "0.1.0"
description = "ONZE — score-distribution engine for the 2026 World Cup (full P(x,y) matrix per match)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ONZE team" }]

dependencies = [
  # data
  "pandas==2.2.3",
  "numpy==2.1.3",
  "pyarrow==18.1.0",
  "duckdb==1.1.3",
  "requests==2.32.3",
  "pyyaml==6.0.2",
  # modelling
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  # api
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "hypothesis==6.122.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
